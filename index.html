<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>High Society</title>
    <meta name="description" content="High Society — elite personal shopping service." />
    <meta name="theme-color" content="#080706" />
    <link rel="icon" type="image/png" href="icon-180.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="preload" href="fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#shop">Skip to products</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#top" id="brand" data-shop-name>High Society</a>
        <nav class="site-nav" aria-label="Main">
          <a href="#shop">Shop</a>
          <a href="#request">Request</a>
          <a href="#about">About</a>
        </nav>
        <button type="button" class="cart-button" id="cart-button" aria-haspopup="dialog" aria-controls="cart-dialog">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 3.5h2.6l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.2" />
            <circle cx="9.5" cy="20" r="1.4" /><circle cx="17.5" cy="20" r="1.4" />
          </svg>
          <span class="cart-count" id="cart-count" aria-hidden="true" hidden>0</span>
          <span class="visually-hidden" id="cart-button-label">Cart, 0 items</span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container hero-inner">
          <h1 id="hero-title" class="hero-title" data-shop-name>High Society</h1>
          <div class="glint-line" aria-hidden="true"></div>
        </div>
      </section>

      <section class="section section--about" id="about" aria-labelledby="about-title" tabindex="-1">
        <div class="container about-inner">
          <h2 class="section-title" id="about-title">About</h2>
          <div id="about-text" class="about-text"></div>
        </div>
      </section>

      <section class="section section--faq" id="faq" aria-labelledby="faq-title">
        <div class="container faq-inner">
          <h2 class="section-title" id="faq-title">Frequently asked questions</h2>
          <div id="faq-list" class="faq-list"></div>
        </div>
      </section>

      <section class="section" id="shop" aria-labelledby="shop-title" tabindex="-1">
        <div class="container">
          <h2 class="section-title" id="shop-title">The Collection</h2>

          <!-- Search and filters are built from shopConfig.js by app.js -->
          <div class="filters" id="filters" role="search" aria-label="Search and filter products"></div>

          <p class="catalogue-status" id="catalogue-status" role="status">Loading products…</p>
          <ul class="product-grid" id="product-grid" aria-busy="true">
            <li class="card card--skeleton" aria-hidden="true"><div class="card-media"></div><div class="card-body"><span></span><span></span></div></li>
            <li class="card card--skeleton" aria-hidden="true"><div class="card-media"></div><div class="card-body"><span></span><span></span></div></li>
            <li class="card card--skeleton" aria-hidden="true"><div class="card-media"></div><div class="card-body"><span></span><span></span></div></li>
            <li class="card card--skeleton" aria-hidden="true"><div class="card-media"></div><div class="card-body"><span></span><span></span></div></li>
          </ul>
        </div>
      </section>

      <section class="section section--request" id="request" aria-labelledby="request-title" tabindex="-1">
        <div class="container request-inner">
          <h2 class="section-title" id="request-title">Request Services</h2>
          <!-- Request form is built from shopConfig.js by app.js -->
          <div id="request-body" class="request-body"></div>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="glint-line" aria-hidden="true"></div>
        <p class="footer-name" data-shop-name>High Society</p>
        <p class="footer-tagline" id="footer-tagline"></p>
        <div class="footer-links" id="footer-links"></div>
        <p class="footer-copy">© <span id="footer-year"></span> <span data-shop-name>High Society</span></p>
      </div>
    </footer>

    <!-- Product details pop-up (content rendered by app.js) -->
    <dialog class="modal" id="product-dialog" aria-labelledby="pd-name">
      <div class="modal-inner" id="product-dialog-content"></div>
    </dialog>

    <!-- Cart + checkout drawer (content rendered by app.js) -->
    <dialog class="drawer" id="cart-dialog" aria-labelledby="cart-title">
      <div class="drawer-inner">
        <div class="drawer-head">
          <h2 class="drawer-title" id="cart-title" tabindex="-1">Your cart</h2>
          <button type="button" class="icon-btn" data-close-cart aria-label="Close cart">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ol class="steps" id="checkout-steps" aria-label="Checkout steps">
          <li data-step="cart">Cart</li>
          <li data-step="details">Details</li>
          <li data-step="send">Send</li>
        </ol>
        <div class="drawer-body" id="cart-body"></div>
        <div class="drawer-foot" id="cart-foot"></div>
      </div>
    </dialog>

    <div class="visually-hidden" id="live-region" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p class="noscript">Please turn on JavaScript to browse and order from this shop.</p>
    </noscript>

    <script>
      // If the shop script fails to start (for example a typo in shopConfig.js), say so instead of loading forever.
      setTimeout(function () {
        if (window.__shopReady) return;
        var s = document.getElementById('catalogue-status');
        var g = document.getElementById('product-grid');
        if (s) s.textContent = 'Sorry, the shop could not load. Please refresh the page or try again later.';
        if (g) { g.innerHTML = ''; g.removeAttribute('aria-busy'); }
      }, 6000);
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
